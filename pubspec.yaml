version: 1.0.0+1

environment:
  sdk: '^3.14.0'

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.4
  flutter_onnxruntime: ^1.9.1
  image: ^4.13.1
  material_ui: ^1.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
